<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Manutenção Preventiva - Romi T240 (SENAI)</title>
    <!-- Biblioteca A-Frame gratuita -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene embedded vr-mode-ui="enabled: true">
      <!-- Iluminação -->
      <a-ambient-light color="#FFF" intensity="0.8"></a-ambient-light>
      <a-directional-light position="-1 2 1" intensity="0.5"></a-directional-light>

      <!-- Câmera com cursor de olhar (Gaze Interaction para Óculos Smartphone) -->
      <a-entity position="0 1.6 2">
        <a-camera>
          <a-cursor
            id="cursor"
            color="#FF0000"
            scale="0.02 0.02 0.02"
            animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 0.02 0.02 0.02"
            animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 0.02 0.02 0.02; to: 0.1 0.1 0.1">
          </a-cursor>
        </a-camera>
      </a-entity>

      <!-- Representação Simplificada do Torno Romi T240 -->
      <a-group position="0 0 -1">
        <!-- Base do Torno -->
        <a-box position="0 0.4 0" width="1.8" height="0.8" depth="0.6" color="#2C3E50"></a-box>
        <!-- Cabeçote Fixo -->
        <a-box position="-0.6 1.0 0" width="0.6" height="0.6" depth="0.6" color="#7F8C8D"></a-box>
        <!-- Barramento -->
        <a-box position="0.2 0.8 0" width="1.0" height="0.1" depth="0.4" color="#BDC3C7"></a-box>

        <!-- PONTO A: Barramento -->
        <a-sphere id="ponto-barramento" position="0.2 0.9 0" radius="0.06" color="#E74C3C">
        </a-sphere>

        <!-- PONTO C: Visor de Óleo do Cabeçote -->
        <a-cylinder id="ponto-cabecote" position="-0.6 0.9 0.31" radius="0.05" height="0.02" rotation="90 0 0" color="#2ECC71">
        </a-cylinder>
      </a-group>

      <!-- Painel de Informações UI em 3D -->
      <a-plane position="0 2.2 -1" width="1.8" height="0.6" color="#111" opacity="0.9">
        <a-text id="info-text" value="Mova o ponto vermelho sobre os marcadores no Torno T240 para ver o plano de lubrificacao." 
                align="center" width="1.6" color="#FFF" position="0 0 0.01"></a-text>
      </a-plane>
    </a-scene>

    <script>
      const infoText = document.querySelector('#info-text');

      document.querySelector('#ponto-barramento').addEventListener('mouseenter', () => {
        infoText.setAttribute('value', 'PONTO A: Barramento e Guias\nLubrificante: Oleo ISO VG 68\nFrequencia: Diaria\nMetodo: Camada fina com almotolia');
      });

      document.querySelector('#ponto-cabecote').addEventListener('mouseenter', () => {
        infoText.setAttribute('value', 'PONTO C: Cabecote Fixo\nLubrificante: Oleo ISO VG 32\nFrequencia: Checar diario / Troca semestral\nQtd: 5.5 Litros (centro do visor)');
      });
    </script>
  </body>
</html>
