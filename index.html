<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manutenção Preventiva - Romi T240 (SENAI)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #1a252f;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: #2c3e50;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 8px;
        color: #ecf0f1;
      }
      p {
        font-size: 0.95rem;
        color: #bdc3c7;
        margin-bottom: 25px;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 14px 0;
        margin: 12px 0;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        transition: background 0.3s ease;
        box-sizing: border-box;
      }
      .btn-vr {
        background-color: #3498db;
        color: white;
      }
      .btn-vr:hover {
        background-color: #2980b9;
      }
      .btn-ar {
        background-color: #2ecc71;
        color: white;
      }
      .btn-ar:hover {
        background-color: #27ae60;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Torno Romi T240</h1>
      <p>Selecione o modo de aprendizado para a manutenção preventiva:</p>

      <!-- Botão para carregar a simulação 3D/VR -->
      <a href="vr.html" class="btn btn-vr">🥽 Modo Realidade Virtual (VR)</a>

      <!-- Botão para carregar a câmara AR da oficina -->
      <a href="ar.html" class="btn btn-ar">📷 Modo Realidade Aumentada (AR)</a>
    </div>
  </body>
</html>
