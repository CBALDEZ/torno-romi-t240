<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR - Torno Romi T240 (SENAI)</title>
    <!-- Biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      .btn-voltar {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 0.95rem;
        font-weight: bold;
        border: 1px solid #ffffff;
        box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      }
      .instrucoes-vr {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 20px;
        font-family: Arial, sans-serif;
        font-size: 0.85rem;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <!-- Botão de retorno ao menu -->
    <a href="index.html" class="btn-voltar">← Voltar ao Menu</a>

    <!-- Instrução fixa na tela -->
    <div class="instrucoes-vr">Mova a mira sobre as esferas para ver as informações de lubrificação</div>

    <a-scene vr-mode-ui="enabled: true">
      
      <!-- PAINEL PRINCIPAL DE INFORMAÇÕES VR (ACIMA DO TORNO) -->
      <a-entity id="painel-info" position="0 2.6 -3">
        <a-plane width="3.2" height="1.1" color="#111111" opacity="0.92" border="1px solid #00FFCC">
          <a-text id="texto-painel" value="LUBRIFICACAO ROMI T240\n\nPosicione a mira ciano sobre um dos\npontos (A, B, C, D, E ou F) para ver os detalhes." align="center" width="2.9" color="#00FFCC" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>

      <!-- MÁQUINA VIRTUAL (TORNO ROMI T240) -->
      <a-entity id="torno-base">
        <!-- Base e Barramento -->
        <a-box position="0 0.5 -3" width="3" height="1" depth="1.2" color="#34495E"></a-box>
        <a-box position="0 1.05 -3" width="2.8" height="0.1" depth="0.8" color="#95A5A6"></a-box>
        <!-- Cabeçote Fixo e Placa -->
        <a-box position="-1 1.5 -3" width="0.8" height="0.8" depth="1" color="#2C3E50"></a-box>
        <a-cylinder position="-0.5 1.5 -3" rotation="0 0 90" radius="0.35" height="0.15" color="#7F8C8D"></a-cylinder>
      </a-entity>

      <!-- PONTOS DE LUBRIFICAÇÃO CLICÁVEIS/FOCÁVEIS -->
      
      <!-- PONTO A -->
      <a-sphere class="clickable" position="0.2 1.25 -2.7" radius="0.12" color="#E74C3C"
        data-info="PONTO A: BARRAMENTO E GUIAS\n\n- Lubrificante: Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: Camada fina com almotolia">
        <a-text value="A" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO B -->
      <a-sphere class="clickable" position="0.5 1.35 -2.6" radius="0.12" color="#F1C40F"
        data-info="PONTO B: ESFERAS DOS CARROS\n\n- Lubrificante: Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: 2 a 3 bombadas manuais">
        <a-text value="B" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#000"></a-text>
      </a-sphere>

      <!-- PONTO C -->
      <a-sphere class="clickable" position="-1 1.95 -3" radius="0.12" color="#2ECC71"
        data-info="PONTO C: CABECOTE FIXO\n\n- Lubrificante: Oleo ISO VG 32\n- Frequencia: Checar diario / Semestral\n- Qtd: 5,5 Litros (visor)">
        <a-text value="C" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO D -->
      <a-sphere class="clickable" position="-1 1.15 -2.3" radius="0.12" color="#3498DB"
        data-info="PONTO D: CAIXA NORTON\n\n- Lubrificante: Oleo ISO VG 150\n- Frequencia: Troca semestral\n- Qtd: Aprox. 1,3 Litros">
        <a-text value="D" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO E -->
      <a-sphere class="clickable" position="0.2 0.85 -2.3" radius="0.12" color="#9B59B6"
        data-info="PONTO E: AVENTAL DO CARRO\n\n- Lubrificante: Oleo ISO VG 150\n- Frequencia: Troca bimestral\n- Qtd: Aprox. 0,5 Litro">
        <a-text value="E" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO F -->
      <a-sphere class="clickable" position="-1.4 1.5 -3" radius="0.12" color="#E67E22"
        data-info="PONTO F: ENGRENAGENS DA LIRA\n\n- Lubrificante: Graxa NLGI 2\n- Frequencia: Anual / Necessidade\n- Metodo: Aplicacao manual leve">
        <a-text value="F" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- CÂMERA E MIRA DE FOCO CENTRAL -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera look-controls="pointerLockEnabled: false">
          <a-entity
            cursor="fuse: true; fuseTimeout: 800"
            raycaster="objects: .clickable"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
            material="color: #00FFCC; shader: flat"
            animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
            animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 800; from: 1 1 1; to: 0.3 0.3 0.3"
            animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 150; to: 1 1 1">
          </a-entity>
        </a-camera>
      </a-entity>

      <!-- ILUMINAÇÃO -->
      <a-sky color="#1A252F"></a-sky>
      <a-ambient-light color="#FFFFFF" intensity="0.85"></a-ambient-light>
      <a-directional-light position="-1 2 1" intensity="0.5"></a-directional-light>
    </a-scene>

    <!-- SCRIPT DE INTERAÇÃO DA MIRA COM O PAINEL DE TEXTO -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const textoPainel = document.getElementById('texto-painel');
        const pontos = document.querySelectorAll('.clickable');

        pontos.forEach(ponto => {
          // Quando a mira passa por cima ou ativa o ponto
          ponto.addEventListener('mouseenter', () => {
            const info = ponto.getAttribute('data-info');
            textoPainel.setAttribute('value', info);
            textoPainel.setAttribute('color', '#FFFFFF');
          });

          ponto.addEventListener('click', () => {
            const info = ponto.getAttribute('data-info');
            textoPainel.setAttribute('value', info);
            textoPainel.setAttribute('color', '#00FFCC');
          });
        });
      });
    </script>
  </body>
</html>
