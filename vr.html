<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR - Torno Romi T240 (SENAI)</title>
    <!-- Biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      .btn-voltar {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 0.95rem;
        font-weight: bold;
        border: 1px solid #ffffff;
        box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      }
      .instrucoes-vr {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 20px;
        font-family: Arial, sans-serif;
        font-size: 0.85rem;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <!-- Botão de retorno -->
    <a href="index.html" class="btn-voltar">← Voltar ao Menu</a>

    <!-- Mensagem de orientação para o aluno -->
    <div class="instrucoes-vr">Alinhe a mira no centro da tela sobre os pontos para selecionar</div>

    <a-scene vr-mode-ui="enabled: true">
      <!-- MÁQUINA VIRTUAL / ESTRUTURA DO TORNO (Representação 3D) -->
      <a-entity id="torno-base">
        <!-- Corpo Principal do Torno -->
        <a-box position="0 0.5 -3" width="3" height="1" depth="1.2" color="#34495E"></a-box>
        <!-- Barramento -->
        <a-box position="0 1.05 -3" width="2.8" height="0.1" depth="0.8" color="#95A5A6"></a-box>
        <!-- Cabeçote Fixo -->
        <a-box position="-1 1.5 -3" width="0.8" height="0.8" depth="1" color="#2C3E50"></a-box>
        <!-- Placa da Castanha -->
        <a-cylinder position="-0.5 1.5 -3" rotation="0 0 90" radius="0.35" height="0.15" color="#7F8C8D"></a-cylinder>
      </a-entity>

      <!-- PONTOS DE LUBRIFICAÇÃO CLICÁVEIS (INTERATIVOS) -->
      
      <!-- PONTO A: Barramento -->
      <a-sphere class="clickable" position="0.2 1.25 -2.7" radius="0.12" color="#E74C3C">
        <a-text value="A" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO B: Esferas dos Carros -->
      <a-sphere class="clickable" position="0.5 1.35 -2.6" radius="0.12" color="#F1C40F">
        <a-text value="B" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#000"></a-text>
      </a-sphere>

      <!-- PONTO C: Cabeçote Fixo -->
      <a-sphere class="clickable" position="-1 1.95 -3" radius="0.12" color="#2ECC71">
        <a-text value="C" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO D: Caixa Norton -->
      <a-sphere class="clickable" position="-1 1.15 -2.3" radius="0.12" color="#3498DB">
        <a-text value="D" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO E: Avental do Carro -->
      <a-sphere class="clickable" position="0.2 0.85 -2.3" radius="0.12" color="#9B59B6">
        <a-text value="E" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO F: Engrenagens Lira -->
      <a-sphere class="clickable" position="-1.4 1.5 -3" radius="0.12" color="#E67E22">
        <a-text value="F" align="center" position="0 0 0.13" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- CÂMERA E MIRA (RAYCASTER/CURSOR CENTRAL) -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera look-controls="pointerLockEnabled: false">
          <!-- Anel de Mira centralizado na tela -->
          <a-entity
            cursor="fuse: true; fuseTimeout: 1200"
            raycaster="objects: .clickable"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
            material="color: #00FFCC; shader: flat"
            animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
            animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1200; from: 1 1 1; to: 0.3 0.3 0.3"
            animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 150; to: 1 1 1">
          </a-entity>
        </a-camera>
      </a-entity>

      <!-- Iluminação da Cena -->
      <a-sky color="#1A252F"></a-sky>
      <a-ambient-light color="#FFFFFF" intensity="0.8"></a-ambient-light>
      <a-directional-light position="-1 2 1" intensity="0.5"></a-directional-light>
    </a-scene>
  </body>
</html>
