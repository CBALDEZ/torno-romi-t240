<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>VR - Romi T240 (SENAI)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      .a-enter-vr {
        position: fixed !important;
        bottom: 30px !important;
        right: 20px !important;
        z-index: 9999 !important;
      }
    </style>
  </head>
  <body>
    <a-scene embedded vr-mode-ui="enabled: true" renderer="colorManagement: true;">
      <a-ambient-light color="#FFF" intensity="0.8"></a-ambient-light>
      <a-directional-light position="-1 2 1" intensity="0.6"></a-directional-light>

      <a-entity position="0 1.6 2.2">
        <a-camera>
          <a-cursor id="cursor" color="#FF0000" scale="0.02 0.02 0.02"></a-cursor>
        </a-camera>
      </a-entity>

      <a-entity position="0 0 -1">
        <a-box position="0 0.4 0" width="2.2" height="0.8" depth="0.6" color="#2C3E50"></a-box>
        <a-box position="-0.75 1.05 0" width="0.7" height="0.5" depth="0.6" color="#7F8C8D"></a-box>
        <a-box position="0.25 0.82 0" width="1.3" height="0.08" depth="0.4" color="#BDC3C7"></a-box>
        <a-box position="0.1 0.95 0.1" width="0.35" height="0.25" depth="0.4" color="#34495E"></a-box>
        <a-box position="0.75 0.98 0" width="0.3" height="0.25" depth="0.3" color="#95A5A6"></a-box>

        <!-- PONTO A ao F -->
        <a-sphere id="ponto-A" position="0.35 0.9 0" radius="0.06" color="#E74C3C"></a-sphere>
        <a-sphere id="ponto-B" position="0.1 1.1 0.1" radius="0.05" color="#F1C40F"></a-sphere>
        <a-cylinder id="ponto-C" position="-0.75 0.95 0.31" radius="0.05" height="0.02" rotation="90 0 0" color="#2ECC71"></a-cylinder>
        <a-box id="ponto-D" position="-0.75 0.6 0.31" width="0.12" height="0.12" depth="0.02" color="#3498DB"></a-box>
        <a-sphere id="ponto-E" position="0.1 0.75 0.31" radius="0.05" color="#9B59B6"></a-sphere>
        <a-cylinder id="ponto-F" position="-1.12 0.9 0" radius="0.06" height="0.03" rotation="0 0 90" color="#E67E22"></a-cylinder>
      </a-entity>

      <a-plane position="0 2.35 -1" width="2.1" height="0.7" color="#111" opacity="0.92">
        <a-text id="info-text" value="PLANO DE LUBRIFICACAO - ROMI T240\n\nApunte o ponto vermelho sobre os marcadores (A a F)\npara visualizar o tipo de oleo, quantidade e frequencia." align="center" width="1.9" color="#FFF" position="0 0 0.01"></a-text>
      </a-plane>
    </a-scene>

    <script>
      const infoText = document.querySelector('#info-text');
      document.querySelector('#ponto-A').addEventListener('mouseenter', () => { infoText.setAttribute('value', 'PONTO A: Barramento e Guias\nLubrificante: Oleo ISO VG 68\nFrequencia: Diaria\nMetodo: Camada fina com almotolia'); });
      document.querySelector('#ponto-B').addEventListener('mouseenter', () => { infoText.setAttribute('value', 'PONTO B: Esferas dos Carros\nLubrificante: Oleo ISO VG 68\nFrequencia: Diaria\nMetodo: 2 a 3 bombadas com bomba manual'); });
      document.querySelector('#ponto-C').addEventListener('mouseenter', () => { infoText.setAttribute('value', 'PONTO C: Cabecote Fixo\nLubrificante: Oleo ISO VG 32\nFrequencia: Checar diario / Troca semestral\nQtd: 5,5 Litros (centro do visor)'); });
      document.querySelector('#ponto-D').addEventListener('mouseenter', () => { infoText.setAttribute('value', 'PONTO D: Caixa Norton\nLubrificante: Oleo ISO VG 150\nFrequencia: Troca semestral\nQtd: 1,3 Litros'); });
      document.querySelector('#ponto-E').addEventListener('mouseenter', () => { infoText.setAttribute('value', 'PONTO E: Avental\nLubrificante: Oleo ISO VG 150\nFrequencia: Troca bimestral\nQtd: 0,5 Litro'); });
      document.querySelector('#ponto-F').addEventListener('mouseenter', () => { infoText.setAttribute('value', 'PONTO F: Engrenagens da Lira\nLubrificante: Graxa NLGI 2\nFrequencia: Anual\nMetodo: Aplicacao manual leve'); });
    </script>
  </body>
</html>
