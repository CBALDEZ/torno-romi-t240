<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR - Torno Romi T240 (SENAI)</title>
    <!-- Bibliotecas A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      .btn-voltar {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 0.95rem;
        font-weight: bold;
        border: 1px solid #ffffff;
        box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <!-- Botão para voltar ao menu -->
    <a href="index.html" class="btn-voltar">← Voltar ao Menu</a>

    <!-- Configuração da Cena AR -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; maxDetectionRate: 60; canvasWidth: 1280; canvasHeight: 960;"
      vr-mode-ui="enabled: false">

      <!-- PONTO A: Barramento e Guias (Marcador Hiro) -->
      <a-marker preset="hiro">
        <a-sphere position="0 0.1 0" radius="0.1" color="#E74C3C" animation="property: position; to: 0 0.2 0; dir: alternate; loop: true; dur: 1000"></a-sphere>
        <!-- Painel totalmente plano (rotation="-90 0 0") sobre o marcador -->
        <a-plane position="0 0.05 0.9" rotation="-90 0 0" width="2.2" height="0.8" color="#111111" opacity="0.95">
          <a-text value="PONTO A: BARRAMENTO E GUIAS\n\n- Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: Almotolia" align="center" width="2.1" color="#FFFFFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO B: Esferas dos Carros (Marcador Kanji) -->
      <a-marker preset="kanji">
        <a-sphere position="0 0.1 0" radius="0.1" color="#F1C40F" animation="property: position; to: 0 0.2 0; dir: alternate; loop: true; dur: 1000"></a-sphere>
        <a-plane position="0 0.05 0.9" rotation="-90 0 0" width="2.2" height="0.8" color="#111111" opacity="0.95">
          <a-text value="PONTO B: ESFERAS DOS CARROS\n\n- Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: 2-3 bombadas" align="center" width="2.1" color="#FFFFFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO C: Cabeçote Fixo (Barcode 0) -->
      <a-marker type="barcode" value="0">
        <a-cylinder position="0 0.1 0" radius="0.1" height="0.03" color="#2ECC71" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-cylinder>
        <a-plane position="0 0.05 0.9" rotation="-90 0 0" width="2.2" height="0.8" color="#111111" opacity="0.95">
          <a-text value="PONTO C: CABECOTE FIXO\n\n- Oleo ISO VG 32\n- Frequencia: Semestral\n- Qtd: 5,5 Litros" align="center" width="2.1" color="#FFFFFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO D: Caixa Norton (Barcode 1) -->
      <a-marker type="barcode" value="1">
        <a-box position="0 0.1 0" width="0.15" height="0.15" depth="0.15" color="#3498DB" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        <a-plane position="0 0.05 0.9" rotation="-90 0 0" width="2.2" height="0.8" color="#111111" opacity="0.95">
          <a-text value="PONTO D: CAIXA NORTON\n\n- Oleo ISO VG 150\n- Frequencia: Semestral\n- Qtd: 1,3 Litros" align="center" width="2.1" color="#FFFFFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO E: Avental do Carro (Barcode 2) -->
      <a-marker type="barcode" value="2">
        <a-sphere position="0 0.1 0" radius="0.1" color="#9B59B6" animation="property: position; to: 0 0.2 0; dir: alternate; loop: true; dur: 1000"></a-sphere>
        <a-plane position="0 0.05 0.9" rotation="-90 0 0" width="2.2" height="0.8" color="#111111" opacity="0.95">
          <a-text value="PONTO E: AVENTAL DO CARRO\n\n- Oleo ISO VG 150\n- Frequencia: Bimestral\n- Qtd: 0,5 Litro" align="center" width="2.1" color="#FFFFFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO F: Engrenagens da Lira (Barcode 3) -->
      <a-marker type="barcode" value="3">
        <a-cylinder position="0 0.1 0" radius="0.1" height="0.03" color="#E67E22" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-cylinder>
        <a-plane position="0 0.05 0.9" rotation="-90 0 0" width="2.2" height="0.8" color="#111111" opacity="0.95">
          <a-text value="PONTO F: ENGRENAGENS LIRA\n\n- Graxa NLGI 2\n- Frequencia: Anual\n- Metodo: Aplicacao leve" align="center" width="2.1" color="#FFFFFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
