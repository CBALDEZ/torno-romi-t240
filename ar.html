<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR - Todos os Pontos - Romi T240 (SENAI)</title>
    <!-- Bibliotecas WebXR e AR.js -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

      <!-- PONTO A: Barramento e Guias (Marcador Hiro) -->
      <a-marker preset="hiro">
        <a-sphere position="0 0.5 0" radius="0.12" color="#E74C3C" animation="property: position; to: 0 0.6 0; dir: alternate; loop: true; dur: 1000"></a-sphere>
        <a-plane position="0 1.2 0" rotation="-30 0 0" width="2.2" height="0.8" color="#111" opacity="0.9">
          <a-text value="PONTO A: BARRAMENTO E GUIAS\n\n- Lubrificante: Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: Camada fina com almotolia" align="center" width="2.0" color="#FFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO B: Esferas de Lubrificação / Carros (Marcador Kanji) -->
      <a-marker preset="kanji">
        <a-sphere position="0 0.5 0" radius="0.12" color="#F1C40F" animation="property: position; to: 0 0.6 0; dir: alternate; loop: true; dur: 1000"></a-sphere>
        <a-plane position="0 1.2 0" rotation="-30 0 0" width="2.2" height="0.8" color="#111" opacity="0.9">
          <a-text value="PONTO B: ESFERAS DOS CARROS\n\n- Lubrificante: Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: 2 a 3 bombadas manuais" align="center" width="2.0" color="#FFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO C: Cabeçote Fixo (Marcador Código 0) -->
      <a-marker type="barcode" value="0">
        <a-cylinder position="0 0.5 0" radius="0.12" height="0.04" color="#2ECC71" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-cylinder>
        <a-plane position="0 1.2 0" rotation="-30 0 0" width="2.2" height="0.8" color="#111" opacity="0.9">
          <a-text value="PONTO C: CABECOTE FIXO\n\n- Lubrificante: Oleo ISO VG 32\n- Frequencia: Checar diario / Semestral\n- Qtd: 5,5 Litros (centro do visor)" align="center" width="2.0" color="#FFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO D: Caixa Norton (Marcador Código 1) -->
      <a-marker type="barcode" value="1">
        <a-box position="0 0.5 0" width="0.2" height="0.2" depth="0.2" color="#3498DB" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        <a-plane position="0 1.2 0" rotation="-30 0 0" width="2.2" height="0.8" color="#111" opacity="0.9">
          <a-text value="PONTO D: CAIXA NORTON\n\n- Lubrificante: Oleo ISO VG 150\n- Frequencia: Troca semestral\n- Qtd: Aprox. 1,3 Litros" align="center" width="2.0" color="#FFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO E: Avental (Marcador Código 2) -->
      <a-marker type="barcode" value="2">
        <a-sphere position="0 0.5 0" radius="0.12" color="#9B59B6" animation="property: position; to: 0 0.6 0; dir: alternate; loop: true; dur: 1000"></a-sphere>
        <a-plane position="0 1.2 0" rotation="-30 0 0" width="2.2" height="0.8" color="#111" opacity="0.9">
          <a-text value="PONTO E: AVENTAL DO CARRO\n\n- Lubrificante: Oleo ISO VG 150\n- Frequencia: Troca bimestral\n- Qtd: Aprox. 0,5 Litro" align="center" width="2.0" color="#FFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <!-- PONTO F: Engrenagens da Lira (Marcador Código 3) -->
      <a-marker type="barcode" value="3">
        <a-cylinder position="0 0.5 0" radius="0.12" height="0.04" color="#E67E22" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-cylinder>
        <a-plane position="0 1.2 0" rotation="-30 0 0" width="2.2" height="0.8" color="#111" opacity="0.9">
          <a-text value="PONTO F: ENGRENAGENS DA LIRA\n\n- Lubrificante: Graxa NLGI 2\n- Frequencia: Anual / Necessidade\n- Metodo: Aplicacao manual leve" align="center" width="2.0" color="#FFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
