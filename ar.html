<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR - Romi T240 (SENAI)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <a-sphere position="0 0.5 0" radius="0.15" color="#E74C3C" animation="property: position; to: 0 0.6 0; dir: alternate; loop: true; dur: 1000"></a-sphere>
        <a-plane position="0 1.2 0" rotation="-30 0 0" width="2.2" height="0.9" color="#111" opacity="0.9">
          <a-text value="PONTO A: BARRAMENTO E GUIAS\n\n- Lubrificante: Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: Camada fina com almotolia" align="center" width="2.0" color="#FFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <a-marker preset="kanji">
        <a-cylinder position="0 0.5 0" radius="0.15" height="0.05" color="#2ECC71" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-cylinder>
        <a-plane position="0 1.2 0" rotation="-30 0 0" width="2.2" height="0.9" color="#111" opacity="0.9">
          <a-text value="PONTO C: CABECOTE FIXO\n\n- Lubrificante: Oleo ISO VG 32\n- Frequencia: Checar diario / Troca semestral\n- Qtd: 5,5 Litros" align="center" width="2.0" color="#FFF" position="0 0 0.01"></a-text>
        </a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
